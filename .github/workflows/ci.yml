name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # 24 LTS: runs .ts files natively (type stripping), has import.meta.main
          node-version: 24
          cache: npm
          cache-dependency-path: |
            server/package-lock.json
            client/package-lock.json

      - name: Install
        run: npm --prefix server ci && npm --prefix client ci

      # One script, shared with `npm run gate` locally, so CI and the desk
      # can't drift: server typecheck → client typecheck → unit tests →
      # evals selftest → client build. Evals are not here — they cost money.
      - name: Gate
        run: npm run gate
