name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # 24 LTS: runs .ts files natively (type stripping), has import.meta.main
          node-version: 24

      - name: Server tests
        working-directory: server
        run: npm ci && npm test

      - name: Typecheck
        working-directory: server
        run: npm run typecheck

      - name: Evals selftest
        run: node evals/selftest.ts

      - name: Client build
        working-directory: client
        run: npm ci && npx vite build
